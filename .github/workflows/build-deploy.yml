name: Build and deploy

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'            # run on semantic version tags
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'   # pre-release
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} build and test wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out: the old job hard-coded Intel Homebrew paths (/usr/local/opt/llvm),
        # while macos-latest is Apple Silicon. Re-add it with /opt/homebrew paths when needed.
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            triplet: x64-windows
            builddir: dist
          - os: ubuntu-latest
            triplet: x64-linux
            builddir: wheelhouse
    env:
      # Windows: a current vcpkg release, not LibAPR's 2023 submodule (its tool fetches 7-Zip from
      # a URL that no longer answers and predates Visual Studio 2026 on the runners). The manifest
      # in .github/vcpkg lists LibAPR's dependencies; the tag pins their versions.
      # 2026.01.16: the last release with hdf5 1.14 (1.14.6); later ones ship hdf5 2.x.
      VCPKG_TAG: "2026.01.16"
      CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*musllinux*"
      CIBW_ARCHS: "auto64"
      CIBW_BUILD_VERBOSITY: 1
      # VCPKG_DIR_FWD and VCPKG_MANIFEST_FWD are set by the "Get vcpkg" step; forward slashes keep CMake from reading
      # the backslashes of a Windows path as escapes.
      CIBW_ENVIRONMENT_WINDOWS: EXTRA_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_DIR_FWD/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_FWD"
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "pip install -U wheel delvewheel && python fix_windows_wheel.py {wheel} {dest_dir}"
      CIBW_TEST_REQUIRES: "pytest pytest-qt pytest-xvfb"
      CIBW_TEST_COMMAND: "python3 -m pytest -vv {project}/pyapr/tests"
      CIBW_TEST_SKIP: "*-win_amd64"  # windows tests are run separately
      # manylinux_2_28 (AlmaLinux 8) has hdf5-devel in EPEL only
      CIBW_BEFORE_BUILD_LINUX: "dnf install -y epel-release && dnf install -y libtiff-devel hdf5-devel"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Submodule recursive
        run: |
          git submodule update --init --recursive
          git status

      # Latest CMake: 3.31 has no generator for Visual Studio 2026 on windows-latest.
      - uses: lukka/get-cmake@latest

      - name: Get vcpkg
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root="$(cygpath -m '${{ runner.temp }}')/vcpkg"
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg "$root"
          "$root/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$(cygpath -m '${{ runner.temp }}')/vcpkg-cache"
          {
            echo "VCPKG_ROOT=$root"
            echo "VCPKG_DIR_FWD=$root"
            echo "VCPKG_MANIFEST_FWD=$(cygpath -m '${{ github.workspace }}/.github/vcpkg')"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$(cygpath -m '${{ runner.temp }}')/vcpkg-cache"
          } >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}-${{ matrix.triplet }}

      # Developer Command Prompt for x64 with the default Windows SDK
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==4.3.5

      - name: Run cibuildwheel
        run: |
          python -m cibuildwheel --output-dir ${{ matrix.builddir }}

      # vcpkg writes the real error to log files the job never prints: show and keep them on failure.
      - name: Show vcpkg manifest install log
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s globstar nullglob
          logs=(build/**/vcpkg-manifest-install.log)
          [ ${#logs[@]} -gt 0 ] || echo "no vcpkg-manifest-install.log under build/"
          for f in "${logs[@]}"; do
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload vcpkg build logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-vcpkg-logs
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/*/*.log
            build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: ${{ matrix.builddir }}/
          retention-days: 30

  windows-tests:
    name: ${{ matrix.os }} py${{ matrix.python-version }} tests
    runs-on: ${{ matrix.os }}
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels from artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: wheelhouse

      - name: Set version string
        shell: bash
        run: echo "py_version_str=cp$(echo ${{ matrix.python-version }} | tr -d -c 0-9)" >> "$GITHUB_ENV"

      - name: Install package from wheel
        shell: bash
        run: |
          ls -R wheelhouse
          python -m pip install --upgrade pip
          pip install wheelhouse/pyapr-*${{ env.py_version_str }}-*.whl

      # Imports the compiled module before anything loads Qt (pyapr loads _pyaprwrapper before
      # pyqtgraph), from outside the checkout so the installed package is used.
      - name: Import check
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pyapr, numpy as np; a, p = pyapr.converter.get_apr((np.random.default_rng(0).poisson(100, (32, 48, 48))).astype(np.uint16), verbose=False); print(pyapr.__version__, a.total_number_particles())"

      - name: Run tests
        run: |
          pip install pytest pytest-qt
          pytest -vv

  deploy:
    runs-on: ubuntu-latest
    needs: windows-tests
    name: publish to pypi
    # only the upstream repository publishes, and only on a version tag
    if: github.repository == 'AdaptiveParticles/pyapr' && contains(github.ref, 'tags')
    steps:
      - name: Download wheels from artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U twine

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload wheelhouse/*wheels/*.whl

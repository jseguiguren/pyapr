name: Build and deploy

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'            # run on semantic version tags
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'   # pre-release
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} build and test wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out: the old job hard-coded Intel Homebrew paths (/usr/local/opt/llvm),
        # while macos-latest is Apple Silicon. Re-add it with /opt/homebrew paths when needed.
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            triplet: x64-windows
            builddir: dist
          - os: ubuntu-latest
            triplet: x64-linux
            builddir: wheelhouse
    env:
      CMAKE_BUILD_DIR: ${{ github.workspace }}/builddir/
      # vcpkg is a git submodule of LibAPR
      VCPKG_ROOT: ${{ github.workspace }}/external/LibAPR/vcpkg
      CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*musllinux*"
      CIBW_ARCHS: "auto64"
      CIBW_BUILD_VERBOSITY: 1
      # VCPKG_DIR_FWD is set by the "vcpkg paths" step; forward slashes keep CMake from reading
      # the backslashes of a Windows path as escapes.
      CIBW_ENVIRONMENT_WINDOWS: EXTRA_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_DIR_FWD/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_DIR=$LIBAPR_DIR_FWD"
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "pip install -U wheel delvewheel && python fix_windows_wheel.py {wheel} {dest_dir}"
      CIBW_TEST_REQUIRES: "pytest pytest-qt pytest-xvfb"
      CIBW_TEST_COMMAND: "python3 -m pytest -vv {project}/pyapr/tests"
      CIBW_TEST_SKIP: "*-win_amd64"  # windows tests are run separately
      # manylinux_2_28 (AlmaLinux 8) has hdf5-devel in EPEL only
      CIBW_BEFORE_BUILD_LINUX: "dnf install -y epel-release && dnf install -y libtiff-devel hdf5-devel"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Submodule recursive
        run: |
          git submodule update --init --recursive
          git status

      - uses: lukka/get-cmake@latest

      - name: Restore vcpkg and its artifacts.
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/vcpkg_installed/
            ${{ env.VCPKG_ROOT }}
            !${{ env.VCPKG_ROOT }}/buildtrees
            !${{ env.VCPKG_ROOT }}/packages
            !${{ env.VCPKG_ROOT }}/downloads
          key: |
            ${{ hashFiles( 'external/LibAPR/vcpkg.json' ) }}-${{ hashFiles( '.git/modules/external/LibAPR/modules/vcpkg/HEAD' ) }}-${{ matrix.triplet }}-v2

      - name: vcpkg paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_DIR_FWD=$(cygpath -m '${{ env.VCPKG_ROOT }}')" >> "$GITHUB_ENV"
          echo "LIBAPR_DIR_FWD=$(cygpath -m '${{ github.workspace }}/external/LibAPR')" >> "$GITHUB_ENV"

      # Developer Command Prompt for x64 with the default Windows SDK
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==4.3.5

      - name: Run cibuildwheel
        run: |
          python -m cibuildwheel --output-dir ${{ matrix.builddir }}

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: ${{ matrix.builddir }}/
          retention-days: 30

  windows-tests:
    name: ${{ matrix.os }} py${{ matrix.python-version }} tests
    runs-on: ${{ matrix.os }}
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels from artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: wheelhouse

      - name: Set version string
        shell: bash
        run: echo "py_version_str=cp$(echo ${{ matrix.python-version }} | tr -d -c 0-9)" >> $GITHUB_ENV

      - name: Install package from wheel
        shell: bash
        run: |
          ls -R wheelhouse
          python -m pip install --upgrade pip
          pip install wheelhouse/pyapr-*${{ env.py_version_str }}-*.whl

      - name: Run tests
        run: |
          pip install pytest pytest-qt
          pytest -vv

  deploy:
    runs-on: ubuntu-latest
    needs: windows-tests
    name: publish to pypi
    # only the upstream repository publishes, and only on a version tag
    if: github.repository == 'AdaptiveParticles/pyapr' && contains(github.ref, 'tags')
    steps:
      - name: Download wheels from artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U twine

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload wheelhouse/*wheels/*.whl
